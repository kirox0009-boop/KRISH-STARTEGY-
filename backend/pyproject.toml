[project]
name = "krish"
version = "0.1.0"
description = "KRISH - autonomous multi-agent trading strategy factory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "redis>=5.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "yfinance>=0.2.48",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
tune = ["optuna>=4.0"]
crypto = ["ccxt>=4.4"]
postgres = ["psycopg[binary]>=3.2"]
delivery = ["google-api-python-client>=2.150", "google-auth>=2.35"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krish*"]

[tool.setuptools.package-data]
krish = ["web/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Long human-readable strings are deliberately split across lines inside the
    # markdown/report builders; parenthesising every one hurts readability more
    # than it helps.
    "ISC003",
    # Agents must never die from one bad message: broad excepts are the design.
    "BLE001",
    # SQLAlchemy's declarative type_annotation_map is a real class attribute.
    "RUF012",
]
