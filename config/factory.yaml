# Factory behaviour + the bar a strategy must clear to be delivered.
# Everything here is editable from the control room UI.

# Breadth is deliberately low. Ten thousand throwaway strategies is motion, not
# progress: the value is in finding one idea with a real edge and then working it
# properly (see `champion` below). Fewer fresh ideas, far more effort per idea.
cycle:
  interval_seconds: 60          # how often the orchestrator starts a new research cycle
  strategies_per_cycle: 2       # fresh ideas per cycle - kept small on purpose
  max_parallel_backtests: 4
  elite_population: 20          # breeding stock kept per asset

# When an idea shows promise, stop the conveyor belt and work it hard.
#   1. sweep it across every asset and every timeframe  (in-sample only)
#   2. keep the cells where it actually performs
#   3. tune each survivor with a much bigger budget than the routine tuner
#   4. push the results back through the full pipeline for judgement
#
# The sweep never touches out-of-sample data, so the winner can still be judged
# on bars nothing has looked at. And a best-of-N winner is reported with a
# deflated score too, because picking the luckiest of 20 cells flatters itself.
champion:
  enabled: true
  min_score: 0.35             # robust score that earns a campaign
  max_generation: 3           # stop promoting a lineage after this many rounds
  sweep_max_cells: 24         # asset x timeframe combinations to try
  promote_top_k: 2            # how many winning cells to carry forward
  tune_trials: 120            # deep-tune budget per promoted cell

backtest:
  initial_balance: 10000
  risk_per_trade_pct: 1.0
  oos_fraction: 0.3             # last 30% of history is never used for tuning
  min_trades: 40                # below this, results are noise
  warmup_bars: 200

judge:
  # A strategy must clear ALL of these on OUT-OF-SAMPLE data.
  # MEASURED pass rates on 112 out-of-sample backtests, per gate on its own:
  #   drawdown <= 25%   100%     expectancy >= 0.15R  44%
  #   retention >= 0.5   33%     profit factor >= 2.0 25%
  #   trades >= 30       25%     sharpe >= 1.0        16%
  # These four are demanding but reachable, so they stay. Combining them is what
  # makes a PASS rare - which is the point.
  min_oos_sharpe: 1.0
  min_oos_profit_factor: 2.0    # for every 1 lost, at least 2 won
  max_oos_drawdown_pct: 25.0
  # MEASURED: only 25% of backtests reach 30 out-of-sample trades, and that is
  # almost entirely an intraday-vs-daily problem. Median out-of-sample trades:
  #     GOLD H1  37   |   GOLD D1  5   |   BITCOIN D1  9   |   US100 D1  8
  # Daily strategies simply do not trade often enough on this much history to be
  # judged. Prefer H1/H4 until the deeper data sources land (docs/ROADMAP.md
  # Phase 1); do not lower this to make thin samples look significant.
  min_oos_trades: 30
  min_expectancy_r: 0.15        # average result per trade, in R multiples
  max_is_oos_degradation: 0.5   # OOS Sharpe must be >= 50% of IS Sharpe
  borderline_band: 0.15         # within 15% of thresholds -> BORDERLINE, not REJECT

  # Win rate. 0 disables the check.
  # WARNING before you raise this: profit factor and win rate pull in opposite
  # directions. Trend strategies win ~35% of trades and still reach PF 2+ because
  # the winners are large. Demanding 50%+ win rate AND PF 2+ rules out that whole
  # family and leaves only mean-reversion, which tends to have fat tail losses.
  # If you want "more wins than losses", set 50 and expect far fewer passes.
  min_win_rate_pct: 0

  # Growth, from out-of-sample CAGR, so it is a sustained rate not one lucky month.
  #
  # MEASURED on 112 out-of-sample backtests (GOLD H1/D1, BITCOIN D1, US100 D1) at
  # the 1% risk-per-trade below:
  #     median 0.05%/month   p90 0.60%   p95 1.14%   best observed 2.08%
  # So the previous 3.0 setting passed 0 of 112 - it was not strict, it was
  # unreachable, which is why nothing came out for hours. 0.8 is roughly the top
  # decile: demanding, still achievable.
  #
  # IMPORTANT - read before raising this. Monthly return = edge x position size.
  # This gate measures the product, so tightening it mostly selects for strategies
  # that got lucky, not for better edges. Profit factor and expectancy are what
  # measure the edge. If you want more return from the SAME edge, the honest lever
  # is `backtest.risk_per_trade_pct` below - measured drawdown is only 3-9%, well
  # under the 25% limit, so there is real headroom. Raising risk multiplies
  # returns AND drawdown together, which is a decision for you, not the judge.
  min_monthly_return_pct: 0.8

tuner:
  trials: 40
  walk_forward_folds: 4
  complexity_penalty: 0.02      # per tuned parameter, discourages curve fitting

delivery:
  drive_enabled: false
  telegram_enabled: false
  package_name_template: "KRISH_{asset}_{style}_{name}_v{version}"

# Where the bulk lives. `local` keeps everything on the VPS disk (default, zero
# setup). `s3` pushes the price cache and delivered ZIPs to any S3-compatible
# store — Cloudflare R2, Backblaze B2, Wasabi, MinIO, AWS — so the VPS only holds
# what it is actively using. Credentials go in .env, never here.
# The database is separate: point DATABASE_URL at a managed Postgres and the
# blackboard leaves the box too. See docs/CLOUD_STORAGE.md.
storage:
  backend: local               # local | s3
  prefix: krish                # folder inside the bucket
  offload_price_cache: true    # upload Parquet, re-download on demand
  upload_packages: true        # upload delivered ZIPs
  keep_local_packages: true    # false = delete the local ZIP once it is uploaded
  local_cache_keep_days: 14    # prune local Parquet older than this IF uploaded

  # ─── "do not use the VPS disk" master switch ───────────────────────────────
  # ON (the default here) means:
  #   * price history lives in RAM, never written to Parquet   (was ~2-10 MB)
  #   * ZIPs are built in a temp dir and deleted once a remote channel has a copy
  #   * logs rotate at 2 MB x 1 instead of 20 MB x 5           (was up to 120 MB)
  #
  # What this canNOT remove on its own: the database. That is the only part that
  # must be writable continuously, and moving it off the box needs a cloud
  # Postgres URL in .env - see docs/CLOUD_STORAGE.md. Without that, the database
  # is the one remaining consumer, and `retention` below keeps it small.
  #
  # Safety: a package is never deleted unless some other channel (object storage
  # or Telegram) actually confirmed it took a copy. A failed upload keeps the file.
  minimise_local_disk: true
  price_cache: memory          # memory | disk  (forced to memory by the switch)

# Housekeeping. The factory runs forever, so disk use has to be bounded.
# Metrics and verdicts are NEVER deleted by these settings - only the bulky
# per-bar detail (equity curves, trade lists) of work that was already rejected.
# Tuned for a small disk. Metrics and verdicts are NEVER deleted by these - the
# learning loop needs them - only the bulky per-bar detail of rejected work.
# Measured: stripping that detail shrank the database by 54%.
retention:
  # The moment a strategy is REJECTED, delete its bulk - no waiting for a sweep.
  # Goes immediately: all backtest runs (equity curves + trade lists, ~125 KB,
  # about 97% of what a strategy costs) and its event log.
  # Kept, ~5 KB: the fingerprint (so the factory never re-tests the same failing
  # idea) and the verdict checks (the memory agent learns from failures, and the
  # "why nothing is passing" panel is built from them). Diagnosis kept, evidence
  # locker emptied.
  purge_rejected_immediately: true

  prune_interval_minutes: 15
  events_keep_days: 2           # flight-recorder log rows
  rejected_detail_keep_hours: 2   # backstop for anything the instant purge missed
  rejected_keep_days: 14        # drop the leftover stubs after this
  vacuum: true                  # give freed space back to the filesystem (SQLite)
